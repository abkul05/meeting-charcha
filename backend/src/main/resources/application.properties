spring.application.name=MeetingSummarizer

# H2 Database Configuration (In-Memory for easier testing)
spring.datasource.url=jdbc:h2:mem:meetingsummarizer
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Console at /h2-console
spring.h2.console.enabled=true

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server
server.port=8081

# Groq & Gemini API Integration (set in Render environment variables: GROQ_API_KEY or GEMINI_API_KEY)
groq.api.key=${GROQ_API_KEY:}
gemini.api.key=${GEMINI_API_KEY:}

# Resend API Integration (set in Render environment variables: RESEND_API_KEY)
resend.api.key=${RESEND_API_KEY:}

# Multipart file upload limits (allow large audio files)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

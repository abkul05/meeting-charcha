spring.application.name=MeetingSummarizer

# H2 Database Configuration (In-Memory for easier testing)
spring.datasource.url=jdbc:h2:mem:meetingsummarizer
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Console at /h2-console
spring.h2.console.enabled=true

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server
server.port=8081

# Gemini API Integration
gemini.api.key=YOUR_GEMINI_API_KEY_HERE

# Resend API Integration
resend.api.key=YOUR_RESEND_API_KEY_HERE
